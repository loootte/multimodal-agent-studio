[package]
name = "mas-desktop"
version = "0.1.0"
description = "Multimodal Agent Studio desktop shell"
authors = ["loootte"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[lib]
name = "mas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mas-desktop"
path = "src/main.rs"
